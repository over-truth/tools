<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tools · 工具集</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  /* ───────── Reset & Base ───────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  :root {
    --bg: #f7f3ee;
    --bg-secondary: #ede7e0;
    --surface: rgba(255,255,255,0.72);
    --surface-border: rgba(255,255,255,0.45);
    --text-primary: #2d231c;
    --text-secondary: #7a6b5e;
    --text-muted: #b0a294;
    --accent-1: #d4773b;
    --accent-2: #e8915a;
    --accent-glow: rgba(212,119,59,0.18);
    --shadow-card: 0 8px 32px rgba(45,35,28,0.08), 0 2px 8px rgba(45,35,28,0.04);
    --shadow-card-hover: 0 20px 48px rgba(45,35,28,0.12), 0 4px 16px rgba(45,35,28,0.06);
    --noise: 0.5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15120f;
      --bg-secondary: #1f1a16;
      --surface: rgba(30,25,21,0.72);
      --surface-border: rgba(60,52,44,0.4);
      --text-primary: #ede4db;
      --text-secondary: #a89888;
      --text-muted: #6b5f53;
      --accent-1: #e8915a;
      --accent-2: #d4773b;
      --accent-glow: rgba(232,145,90,0.15);
      --shadow-card: 0 8px 32px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2);
      --shadow-card-hover: 0 20px 48px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.25);
    }
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background .35s, color .35s;
  }

  /* ───────── Animated Background ───────── */
  .bg-canvas {
    position: fixed; inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-canvas .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .16;
    will-change: transform;
    animation: orbFloat 24s ease-in-out infinite;
  }
  .bg-canvas .orb:nth-child(1) {
    width: 520px; height: 520px;
    background: var(--accent-1);
    top: -12%; left: -6%;
    animation-delay: 0s;
  }
  .bg-canvas .orb:nth-child(2) {
    width: 400px; height: 400px;
    background: #b0896c;
    bottom: -10%; right: -4%;
    animation-delay: -8s;
    opacity: .10;
  }
  .bg-canvas .orb:nth-child(3) {
    width: 300px; height: 300px;
    background: var(--accent-2);
    top: 50%; left: 50%;
    translate: -50% -50%;
    animation-delay: -16s;
    opacity: .08;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    25% { transform: translate(40px,-30px) scale(1.08); }
    50% { transform: translate(-20px,20px) scale(0.95); }
    75% { transform: translate(30px,40px) scale(1.05); }
  }

  /* ───────── Grain Overlay ───────── */
  .grain {
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* ───────── Layout ───────── */
  .page {
    position: relative; z-index: 1;
    max-width: 1040px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }
  @media (min-width: 768px) {
    .page { padding: 80px 48px 100px; }
  }

  /* ───────── Header ───────── */
  header {
    margin-bottom: 72px;
    opacity: 0; animation: fadeSlideUp 1s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  header .sup {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
    padding: 6px 16px;
    border: 1px solid var(--surface-border);
    border-radius: 100px;
    backdrop-filter: blur(12px);
    background: var(--surface);
  }
  header .sup span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-1); }
  header h1 {
    font-size: clamp(40px, 8vw, 76px);
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -.03em;
    color: var(--text-primary);
  }
  header h1 .highlight {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    margin-top: 20px;
    font-size: 17px;
    font-weight: 300;
    color: var(--text-secondary);
    max-width: 540px;
    line-height: 1.7;
  }

  /* ───────── Section Title ───────── */
  .section-label {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    opacity: 0; animation: fadeSlideUp .8s .3s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .section-label .line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--surface-border), transparent);
  }
  .section-label h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--text-muted);
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ───────── Tool Card ───────── */
  .tools-grid {
    display: grid;
    gap: 24px;
  }
  @media (min-width: 640px) {
    .tools-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  }

  .tool-card {
    position: relative;
    border-radius: 20px;
    padding: 32px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--surface-border);
    box-shadow: var(--shadow-card);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: all .4s cubic-bezier(0.16,1,0.3,1);
    opacity: 0; animation: fadeSlideUp .8s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .tool-card:nth-child(1) { animation-delay: .15s; }
  .tool-card:nth-child(2) { animation-delay: .25s; }
  .tool-card:nth-child(3) { animation-delay: .35s; }

  .tool-card::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 20px;
    opacity: 0;
    background: linear-gradient(135deg, var(--accent-glow), transparent);
    transition: opacity .4s;
    pointer-events: none;
  }
  .tool-card:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: var(--shadow-card-hover);
    border-color: var(--accent-1);
  }
  .tool-card:hover::after { opacity: 1; }

  .tool-card .icon-wrap {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 16px var(--accent-glow);
    position: relative; z-index: 1;
    flex-shrink: 0;
  }

  .tool-card h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    position: relative; z-index: 1;
  }
  .tool-card .sub {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-bottom: 16px;
    position: relative; z-index: 1;
    line-height: 1.6;
  }
  .tool-card .meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--surface-border);
    position: relative; z-index: 1;
  }
  .tool-card .meta .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--accent-glow);
    color: var(--accent-1);
  }
  .tool-card .meta .link-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
    display: flex; align-items: center; gap: 4px;
    transition: color .25s;
  }
  .tool-card:hover .meta .link-label {
    color: var(--accent-1);
  }
  .tool-card .meta .link-label svg {
    width: 14px; height: 14px;
    transition: transform .25s;
  }
  .tool-card:hover .meta .link-label svg {
    transform: translate(3px,-2px);
  }

  /* ───────── Status Badge (empty state) ───────── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-weight: 300;
    grid-column: 1 / -1;
  }

  /* ───────── Footer ───────── */
  footer {
    margin-top: 80px;
    text-align: center;
    font-size: 13px;
    font-weight: 300;
    color: var(--text-muted);
    opacity: 0; animation: fadeSlideUp 1s .5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  footer .dot { margin: 0 8px; }

  /* ───────── Animations ───────── */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>
<div class="grain"></div>

<div class="page">
  <header>
    <div class="sup"><span></span> Tools · 工具集</div>
    <h1>
      <span class="highlight">人力</span>工具<br />
      效率至上
    </h1>
    <p>一套轻量、实用的人力资源小工具 —— 年假计算、发放追踪，让日常管理更清晰。</p>
  </header>

  <div class="section-label">
    <h2>全部工具</h2>
    <div class="line"></div>
  </div>

  <div class="tools-grid">

    <!-- 年假发放追踪器 -->
    <a class="tool-card" href="年假发放.html" target="_blank">
      <div class="icon-wrap">&#9200;</div>
      <h3>年假发放追踪器</h3>
      <p class="sub">输入年假周期与天数，自动生成法定年假与福利年假的发放时间线，清晰展示每笔假期的到账状态与进度。</p>
      <div class="meta">
        <span class="tag">HR</span>
        <span class="tag">年假</span>
        <span class="link-label">
          打开工具
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </span>
      </div>
    </a>

  </div>

  <footer>
    <span>D:\project\github\tools</span>
    <span class="dot">·</span>
    <span>保持简单</span>
  </footer>
</div>

</body>
</html>
