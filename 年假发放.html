<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>年假发放追踪器</title>
        <style>
            :root {
                --bg: #f8fafc;
                --card: #ffffff;
                --text-main: #0f172a;
                --text-sub: #64748b;
                --border: #e2e8f0;
                --primary: #6366f1;
                --primary-light: #e0e7ff;
                --success: #10b981;
                --success-light: #d1fae5;
                --warning: #f59e0b;
                --warning-light: #fef3c7;
                --gray-light: #f1f5f9;
                --shadow:
                    0 4px 6px -1px rgba(0, 0, 0, 0.05),
                    0 2px 4px -1px rgba(0, 0, 0, 0.03);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f172a;
                    --card: #1e293b;
                    --text-main: #f8fafc;
                    --text-sub: #94a3b8;
                    --border: #334155;
                    --primary-light: #312e81;
                    --success-light: #064e3b;
                    --warning-light: #78350f;
                    --gray-light: #334155;
                    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                background: var(--bg);
                color: var(--text-main);
                line-height: 1.5;
                padding: 16px;
                padding-bottom: 40px;
            }
            @media (min-width: 769px) {
                body {
                    padding: 32px 24px 60px;
                }
            }

            .container {
                max-width: 960px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "header   header"
                    "input    input"
                    "dashboard  dashboard"
                    "results  results";
            }

            /* Header */
            .header {
                grid-area: header;
                text-align: center;
                margin-bottom: 24px;
                padding-top: 12px;
            }
            .header h1 {
                font-size: 22px;
                font-weight: 800;
                background: linear-gradient(135deg, var(--primary), #ec4899);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .header p {
                font-size: 13px;
                color: var(--text-sub);
                margin-top: 4px;
            }

            /* Input Card */
            .card {
                grid-area: input;
                background: var(--card);
                border-radius: 16px;
                padding: 20px;
                box-shadow: var(--shadow);
                margin-bottom: 0;
                border: 1px solid var(--border);
                align-self: start;
            }
            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 16px;
                align-items: end;
            }
            .form-grid .form-group {
                min-width: 0;
            }
            .form-grid .btn {
                grid-column: 1 / -1;
                margin-top: 4px;
            }
            .form-grid .form-group label span {
                display: block;
                font-size: 11px;
                margin-top: 2px;
                font-weight: 400;
                color: var(--text-sub);
            }
            .form-group label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                color: var(--text-sub);
            }
            .input-wrap {
                position: relative;
            }
            input {
                width: 100%;
                padding: 12px 14px;
                border: 1.5px solid var(--border);
                border-radius: 10px;
                font-size: 15px;
                background: var(--bg);
                color: var(--text-main);
                outline: none;
                transition: all 0.2s;
                appearance: none;
                -webkit-appearance: none;
            }
            input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            }
            .unit {
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-sub);
                font-size: 14px;
                pointer-events: none;
            }

            .btn {
                width: 100%;
                padding: 14px;
                background: linear-gradient(135deg, var(--primary), #8b5cf6);
                color: white;
                border: none;
                border-radius: 12px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 8px;
                box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
                transition: transform 0.1s;
            }
            .btn:active {
                transform: scale(0.98);
            }

            /* Dashboard (Progress) */
            .dashboard {
                grid-area: dashboard;
                display: none;
                gap: 12px;
                margin-bottom: 24px;
                align-self: start;
            }
            .dashboard.active {
                display: grid;
            }
            @media (min-width: 769px) {
                .dashboard.active {
                    grid-template-columns: 1fr 1fr;
                }
            }
            .stat-card {
                background: var(--card);
                border-radius: 14px;
                padding: 16px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow);
            }
            .stat-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
            }
            .stat-title {
                font-size: 14px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .stat-badge {
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 20px;
                font-weight: 600;
            }
            .badge-stat {
                background: var(--primary-light);
                color: var(--primary);
            }
            .badge-welf {
                background: var(--warning-light);
                color: var(--warning);
            }

            .progress-info {
                display: flex;
                justify-content: space-between;
                font-size: 12px;
                color: var(--text-sub);
                margin-bottom: 6px;
            }
            .progress-val {
                font-weight: 700;
                color: var(--text-main);
                font-size: 14px;
            }
            .progress-bar {
                height: 8px;
                background: var(--gray-light);
                border-radius: 10px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                border-radius: 10px;
                transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .fill-stat {
                background: linear-gradient(90deg, #6366f1, #8b5cf6);
            }
            .fill-welf {
                background: linear-gradient(90deg, #f59e0b, #fbbf24);
            }

            /* Timeline */
            .section-title {
                font-size: 16px;
                font-weight: 700;
                margin: 24px 0 16px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .timeline {
                position: relative;
                padding-left: 24px;
            }
            .timeline::before {
                content: "";
                position: absolute;
                left: 7px;
                top: 8px;
                bottom: 8px;
                width: 2px;
                background: var(--border);
                border-radius: 2px;
            }

            .tl-item {
                position: relative;
                margin-bottom: 16px;
            }
            .tl-item:last-child {
                margin-bottom: 0;
            }
            .tl-node {
                position: absolute;
                left: -24px;
                top: 18px;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                border: 3px solid var(--bg);
                z-index: 1;
                box-shadow: 0 0 0 2px var(--border);
                background: var(--card);
                transition: all 0.3s;
            }

            .tl-card {
                background: var(--card);
                border-radius: 12px;
                padding: 14px 16px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow);
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition: all 0.3s;
            }

            /* States */
            .tl-item.unlocked .tl-node {
                background: var(--success);
                box-shadow: 0 0 0 2px var(--success);
            }
            .tl-item.unlocked .tl-card {
                border-color: var(--success);
                background: linear-gradient(
                    to right,
                    var(--success-light),
                    var(--card)
                );
            }
            .tl-item.unlocked.welf .tl-node {
                background: var(--warning);
                box-shadow: 0 0 0 2px var(--warning);
            }
            .tl-item.unlocked.welf .tl-card {
                border-color: var(--warning);
                background: linear-gradient(
                    to right,
                    var(--warning-light),
                    var(--card)
                );
            }

            .tl-item.locked {
                opacity: 0.6;
            }
            .tl-item.locked .tl-card {
                border-style: dashed;
            }

            .tl-date {
                font-size: 15px;
                font-weight: 700;
            }
            .tl-week {
                font-size: 12px;
                color: var(--text-sub);
                margin-left: 6px;
                font-weight: 500;
            }
            .tl-status {
                font-size: 11px;
                margin-top: 4px;
                font-weight: 600;
            }
            .status-unlocked {
                color: var(--success);
            }
            .status-locked {
                color: var(--text-sub);
            }
            .welf .status-unlocked {
                color: var(--warning);
            }

            .tl-amount {
                font-size: 14px;
                font-weight: 800;
                padding: 4px 10px;
                border-radius: 8px;
                background: var(--gray-light);
                color: var(--text-main);
                white-space: nowrap;
            }
            .tl-item.unlocked .tl-amount {
                background: var(--success);
                color: white;
            }
            .tl-item.unlocked.welf .tl-amount {
                background: var(--warning);
                color: white;
            }

            .summary {
                grid-column: 1 / -1;
                font-size: 12px;
                color: var(--text-sub);
                text-align: center;
                margin-top: 30px;
                padding: 12px;
                background: var(--gray-light);
                border-radius: 10px;
                line-height: 1.8;
            }

            /* Results section: two-column timelines */
            #results {
                grid-area: results;
                display: none;
            }
            #statSection,
            #welfSection {
                min-width: 0;
            }

            /* === PC two-column timelines === */
            /* Only apply grid when JS has made #results visible (display: block) */
            @media (min-width: 769px) {
                #results[style*="block"] {
                    display: grid !important;
                    grid-template-columns: 1fr 1fr;
                    gap: 24px;
                    align-items: start;
                }
                #results[style*="block"] > .summary {
                    grid-column: 1 / -1;
                }
            }

            /* === Mobile / small screens: stack everything === */
            @media (max-width: 768px) {
                .container {
                    display: flex;
                    flex-direction: column;
                }
                .card {
                    margin-bottom: 20px;
                }
                .form-grid {
                    grid-template-columns: 1fr 1fr;
                }
                .form-grid .btn {
                    grid-column: 1 / -1;
                }
                #results > .summary {
                    grid-column: auto;
                }
            }

            /* Wider stat titles on desktop */
            @media (min-width: 769px) {
                .header h1 {
                    font-size: 28px;
                }
                .header p {
                    font-size: 14px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>⏳ 年假发放追踪器</h1>
                <p>清晰掌握每一天的假期进度</p>
            </div>

            <div class="card">
                <div class="form-grid">
                    <div class="form-group">
                        <label>年假周期起始日</label>
                        <input type="date" id="startDate" />
                    </div>
                    <div class="form-group">
                        <label
                            >法定年假 (n天)
                            <span
                                style="color: var(--text-sub); font-weight: 400"
                                >分10次，每次0.5天</span
                            ></label
                        >
                        <div class="input-wrap">
                            <input
                                type="number"
                                id="statDays"
                                placeholder="5"
                                min="0"
                                step="0.5"
                                inputmode="decimal"
                            />
                            <span class="unit">天</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label
                            >福利年假 (m天)
                            <span
                                style="color: var(--text-sub); font-weight: 400"
                                >分m次，每次1天</span
                            ></label
                        >
                        <div class="input-wrap">
                            <input
                                type="number"
                                id="welfDays"
                                placeholder="3"
                                min="0"
                                step="1"
                                inputmode="numeric"
                            />
                            <span class="unit">天</span>
                        </div>
                    </div>
                    <button class="btn" onclick="calculate()">
                        生成发放时间线
                    </button>
                </div>
            </div>

            <!-- 数据看板 -->
            <div id="dashboard" class="dashboard">
                <div class="stat-card" id="statDash" style="display: none">
                    <div class="stat-header">
                        <span class="stat-title">⚖️ 法定年假</span>
                        <span class="stat-badge badge-stat">已解锁</span>
                    </div>
                    <div class="progress-info">
                        <span>发放进度</span>
                        <span class="progress-val"
                            ><span id="statUnlocked">0</span> /
                            <span id="statTotal">0</span> 天</span
                        >
                    </div>
                    <div class="progress-bar">
                        <div
                            class="progress-fill fill-stat"
                            id="statProgress"
                            style="width: 0%"
                        ></div>
                    </div>
                </div>

                <div class="stat-card" id="welfDash" style="display: none">
                    <div class="stat-header">
                        <span class="stat-title">🎁 福利年假</span>
                        <span class="stat-badge badge-welf">已解锁</span>
                    </div>
                    <div class="progress-info">
                        <span>发放进度</span>
                        <span class="progress-val"
                            ><span id="welfUnlocked">0</span> /
                            <span id="welfTotal">0</span> 天</span
                        >
                    </div>
                    <div class="progress-bar">
                        <div
                            class="progress-fill fill-welf"
                            id="welfProgress"
                            style="width: 0%"
                        ></div>
                    </div>
                </div>
            </div>

            <!-- 结果区域 -->
            <div id="results" style="display: none">
                <div id="statSection" style="display: none">
                    <div class="section-title">📅 法定年假发放线</div>
                    <div class="timeline" id="statList"></div>
                </div>

                <div id="welfSection" style="display: none">
                    <div class="section-title">🎉 福利年假发放线</div>
                    <div class="timeline" id="welfList"></div>
                </div>

                <div id="summaryBox" class="summary"></div>
            </div>
        </div>

        <script>
            // 初始化默认值
            document.getElementById("startDate").value = "2026-01-01";
            document.getElementById("statDays").value = "5";
            document.getElementById("welfDays").value = "8";

            function calculate() {
                const startVal = document.getElementById("startDate").value;
                const n =
                    parseFloat(document.getElementById("statDays").value) || 0;
                const m =
                    parseInt(document.getElementById("welfDays").value) || 0;

                if (!startVal) return alert("请选择起始日期");
                if (n <= 0 && m <= 0) return alert("请至少填写一种年假天数");

                const startDate = new Date(startVal + "T00:00:00");
                const endDate = new Date(startDate);
                endDate.setFullYear(endDate.getFullYear() + 1);
                endDate.setDate(endDate.getDate() - 1);

                const totalDays =
                    Math.round((endDate - startDate) / 86400000) + 1;
                const today = new Date();
                today.setHours(0, 0, 0, 0); // 归零时间以便准确对比日期

                let statHtml = "",
                    welfHtml = "";
                let statUnlockedDays = 0,
                    welfUnlockedDays = 0;

                // === 1. 法定年假计算 ===
                if (n > 0) {
                    const maxTimes = 10;
                    const periodLen = totalDays / maxTimes;
                    const actualTimes = Math.min(maxTimes, Math.floor(n / 0.5));
                    const remainder = n - actualTimes * 0.5;

                    for (let i = 1; i <= actualTimes; i++) {
                        const dayOffset = Math.ceil(i * periodLen) - 1;
                        const d = new Date(startDate);
                        d.setDate(d.getDate() + dayOffset);

                        const isUnlocked = d <= today;
                        if (isUnlocked) statUnlockedDays += 0.5;
                        statHtml += createTimelineItem(
                            d,
                            "+0.5天",
                            isUnlocked,
                            false,
                        );
                    }
                    if (remainder > 0.01) {
                        const isUnlocked = endDate <= today;
                        if (isUnlocked) statUnlockedDays += remainder;
                        statHtml += createTimelineItem(
                            endDate,
                            `+${remainder}天`,
                            isUnlocked,
                            false,
                        );
                    }

                    document.getElementById("statSection").style.display =
                        "block";
                    document.getElementById("statList").innerHTML = statHtml;
                    document.getElementById("statDash").style.display = "block";
                    document.getElementById("statTotal").innerText = n;
                    document.getElementById("statUnlocked").innerText =
                        statUnlockedDays;
                    document.getElementById("statProgress").style.width =
                        `${(statUnlockedDays / n) * 100}%`;
                } else {
                    document.getElementById("statSection").style.display =
                        "none";
                    document.getElementById("statDash").style.display = "none";
                }

                // === 2. 福利年假计算 ===
                if (m > 0) {
                    const welfPeriodLen = totalDays / m;
                    for (let i = 1; i <= m; i++) {
                        const dayOffset = Math.ceil(i * welfPeriodLen) - 1;
                        const d = new Date(startDate);
                        d.setDate(d.getDate() + dayOffset);

                        const isUnlocked = d <= today;
                        if (isUnlocked) welfUnlockedDays += 1;
                        welfHtml += createTimelineItem(
                            d,
                            "+1天",
                            isUnlocked,
                            true,
                        );
                    }

                    document.getElementById("welfSection").style.display =
                        "block";
                    document.getElementById("welfList").innerHTML = welfHtml;
                    document.getElementById("welfDash").style.display = "block";
                    document.getElementById("welfTotal").innerText = m;
                    document.getElementById("welfUnlocked").innerText =
                        welfUnlockedDays;
                    document.getElementById("welfProgress").style.width =
                        `${(welfUnlockedDays / m) * 100}%`;
                } else {
                    document.getElementById("welfSection").style.display =
                        "none";
                    document.getElementById("welfDash").style.display = "none";
                }

                // 汇总
                const cycleProgress = Math.min(
                    100,
                    Math.max(
                        0,
                        ((today - startDate) / 86400000 / totalDays) * 100,
                    ),
                ).toFixed(1);
                document.getElementById("summaryBox").innerHTML = `
        📆 年假周期：${fmt(startDate)} 至 ${fmt(endDate)} (共${totalDays}天)<br>
        ⏳ 当前周期进度：<strong>${cycleProgress}%</strong> | 系统判定日期：${fmt(today)}
    `;

                document.getElementById("dashboard").classList.add("active");
                document.getElementById("results").style.display = "block";

                // 平滑滚动到看板
                document
                    .getElementById("dashboard")
                    .scrollIntoView({ behavior: "smooth", block: "start" });
            }

            function createTimelineItem(date, amount, isUnlocked, isWelf) {
                const weekDays = [
                    "周日",
                    "周一",
                    "周二",
                    "周三",
                    "周四",
                    "周五",
                    "周六",
                ];
                const stateClass = isUnlocked ? "unlocked" : "locked";
                const welfClass = isWelf ? "welf" : "";
                const statusText = isUnlocked ? "已到账" : "待发放";
                const statusClass = isUnlocked
                    ? "status-unlocked"
                    : "status-locked";

                return `
        <div class="tl-item ${stateClass} ${welfClass}">
            <div class="tl-node"></div>
            <div class="tl-card">
                <div>
                    <div><span class="tl-date">${fmt(date)}</span><span class="tl-week">${weekDays[date.getDay()]}</span></div>
                    <div class="tl-status ${statusClass}">● ${statusText}</div>
                </div>
                <div class="tl-amount">${amount}</div>
            </div>
        </div>
    `;
            }

            function fmt(d) {
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
            }
        </script>
    </body>
</html>
